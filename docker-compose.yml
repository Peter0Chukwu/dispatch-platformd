# ─────────────────────────────────────────────────────────────────────────────
# Dispatch platform — production-ish stack on one VPS
#
#   cp deploy/.env.example deploy/.env      # then edit the secrets
#   docker compose up -d --build
#   docker compose logs -f api
#
# Four services plus a one-shot migration runner:
#   postgres  — the database, on a named volume, not exposed to the internet
#   redis     — rate limits, dispatch locks, socket adapter
#   migrate   — runs `prisma migrate deploy` once, then exits
#   api       — the NestJS server (behind nothing: only web publishes a port)
#   web       — Nginx serving the SPA and proxying /api + /socket.io to `api`
#
# Only `web` publishes a port. The database, Redis and the API are reachable only
# inside the compose network, which is the simplest internet-facing hardening there is.
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dispatch} -d ${POSTGRES_DB:-dispatch}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: reachable only from other containers in this network.
    expose:
      - '5432'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - '6379'

  # Runs once per `up`, then exits. Kept separate from `api` so that scaling the API
  # never runs two migrations at the same time.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      # The `migrate` target is built FROM the build stage so the Prisma CLI is a
      # first-class, version-locked part of this image instead of a transitive
      # dependency of @prisma/client that a future release might drop.
      target: migrate
    image: dispatch-api:migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Reference data: permissions, roles, a branch, service zones, ledger accounts,
  # settings — and ONE super admin whose email/password come from the environment.
  # Idempotent, so it is safe to re-run. It is a tool, not part of `up`, hence the
  # profile: it only runs when asked.
  #
  #   docker compose run --rm seed
  #
  # Never run the demo seeds (scripts/seed-demo-phase*.mjs) on production: they
  # invent riders, customers and deliveries that are not real.
  seed:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      target: migrate
    image: dispatch-api:migrate
    profiles: ['tools']
    command: ['sh', '-lc', 'cd backend && npx tsx prisma/seed.ts']
    env_file:
      - deploy/.env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    image: dispatch-api:local
    restart: unless-stopped
    env_file:
      - deploy/.env
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Generated report files and uploaded documents live on a volume, so a
      # container rebuild does not lose artifacts that rows still point at.
      - storage-data:/app/backend/storage
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    # Bound to loopback by default: TLS is terminated in front of it (Caddy on the
    # host, or Cloudflare), so the container is not itself internet-facing. Set
    # WEB_BIND=0.0.0.0 in deploy/.env to expose it directly instead — which you
    # should only do while testing, or if TLS is handled by an external proxy.
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'

volumes:
  postgres-data:
  redis-data:
  storage-data:
