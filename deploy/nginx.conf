# Nginx in front of the SPA.
#
# Everything the browser needs is same-origin: the static app, the API under
# /api/v1, and the socket under /socket.io. That is what keeps the HttpOnly
# refresh cookie first-party and lets CORS stay a closed list.

upstream dispatch_api {
    server api:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Uploads travel as base64 inside JSON, so the request body limit must be at
    # least the API's own parser limit (8 MB) plus a little overhead.
    client_max_body_size 12m;

    # Real client IPs, so rate limiting and audit logs are not the proxy's address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # ── security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # The SPA is a single origin with an inline-styled build; scripts are bundled, so
    # no 'unsafe-inline' is needed for them. Google Maps is allowed only when a key is
    # configured (the stub needs nothing).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://maps.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── static app ────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        # Vite fingerprints these filenames, so they can be cached forever.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA fallback: /admin/reports must return index.html, not a 404.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── API ───────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://dispatch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # A report download streams a file; do not buffer the whole thing in the proxy.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ── sockets ───────────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://dispatch_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
