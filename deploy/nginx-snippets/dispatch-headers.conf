# Security headers, re-applied in every location that sets its own headers.
#
# nginx drops inherited `add_header` directives the moment a location defines one
# of its own, so this file is included explicitly rather than relied upon by
# inheritance. Keep it in sync with documentation/GO-LIVE-CHECKLIST.md section C.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

# HSTS is only meaningful over TLS (terminated by Caddy or Cloudflare in front of
# this container). Harmless on plain HTTP — browsers ignore it there — provided the
# domain is HTTPS-only, which the go-live checklist verifies.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The SPA is one origin; scripts are bundled so no 'unsafe-inline'/'unsafe-eval' is
# needed for them. Google Maps is allowed because the map tiles and Places calls go
# to *.googleapis.com / *.gstatic.com. style-src needs 'unsafe-inline' because the
# build inlines critical styles.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
