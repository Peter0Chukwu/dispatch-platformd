# Proxy headers, included in every proxying location.
#
# nginx drops inherited `proxy_set_header` directives as soon as a location sets
# one of its own (the socket location needs Connection: upgrade). Without this
# snippet the API would receive the proxy's address instead of the client's, which
# breaks per-IP rate limiting and pollutes the audit log.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# `add` (not replace): a spoofed header from the client is appended to, and Express
# reads the rightmost entry, so the real peer address always wins.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
